name: Pubblica

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      azione:
        description: "Cosa fare quando lo avvii a mano"
        type: choice
        default: prova-a-vuoto
        options:
          - prova-a-vuoto
          - verifica-meta
          - pubblica

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # Il timer (ogni 30 minuti) pubblica davvero; l'avvio a mano segue la scelta "azione"
      AZIONE: ${{ github.event_name == 'schedule' && 'pubblica' || inputs.azione }}
      # Chiavi di pagina di tutti i clienti: {"cliente": "chiave", ...} (vedi pubblica/chiavi.py)
      META_PAGE_TOKENS: ${{ secrets.META_PAGE_TOKENS }}
      # Vecchia chiave di Rigenera Lab, usata solo se manca in META_PAGE_TOKENS
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Elenco dei clienti presi da config/clienti.json
      - name: Clienti
        run: echo "CLIENTI=$(python -c 'import json;print(" ".join(json.load(open("config/clienti.json"))))')" >> "$GITHUB_ENV"

      # Solo lettura: controlla che la chiave di Meta veda la pagina e l'account Instagram
      - name: Verifica il collegamento a Meta
        if: ${{ env.AZIONE == 'verifica-meta' }}
        run: |
          esito=0
          for c in $CLIENTI; do python -m pubblica.run --cliente "$c" --verifica || esito=1; done
          exit $esito

      # 1. Le grafiche che non sono JPEG diventano JPEG e vengono salvate online
      #    (Meta le scarica da GitHub, quindi devono già esserci prima di pubblicare)
      - name: Converti in JPEG
        if: ${{ env.AZIONE == 'pubblica' }}
        run: for c in $CLIENTI; do python -m pubblica.run --cliente "$c" --solo-converti; done

      - name: Salva le conversioni
        if: ${{ env.AZIONE == 'pubblica' }}
        run: |
          git config user.name "pubblicazione-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Converte le grafiche in JPEG"
            git pull --rebase
            git push
          fi

      # 2. Pubblica ciò che è dovuto in questo momento (o, in prova a vuoto, lo mostra soltanto)
      - name: Pubblica
        id: pubblica
        if: ${{ env.AZIONE != 'verifica-meta' }}
        continue-on-error: true
        env:
          PROVA: ${{ env.AZIONE == 'prova-a-vuoto' && '--dry-run' || '' }}
        # Un cliente con un problema non ferma gli altri; alla fine il giro risulta fallito
        run: |
          esito=0
          for c in $CLIENTI; do
            echo "=== $c ==="
            python -m pubblica.run --cliente "$c" $PROVA || esito=1
          done
          exit $esito

      # 3. Salva cosa è uscito (cartelle spostate in published/, stato, registro delle stories)
      - name: Salva lo stato
        if: ${{ env.AZIONE == 'pubblica' }}
        run: |
          git config user.name "pubblicazione-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna contenuti pubblicati e stato"
            git pull --rebase
            git push
          fi

      # 4. Se qualcosa non è andato bene il giro risulta fallito: GitHub manda l'email di avviso
      - name: Esito
        if: ${{ steps.pubblica.outcome == 'failure' }}
        run: |
          echo "Almeno un contenuto non è uscito: leggi il registro del passo Pubblica."
          exit 1
